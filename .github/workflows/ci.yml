name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }} check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install a virtual display for Tk tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Unit tests, card validation and documented commands
        env:
          VCO_STUDIO_PYTHON: python
        run: xvfb-run -a ./tools/check.sh
